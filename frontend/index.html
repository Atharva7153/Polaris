<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POLARIS — Antarctic Mission Control</title>
    <!--
      config.js is generated at container start by entrypoint.sh.
      It sets window.__POLARIS_API_URL__ to the real backend URL.
      During local `npm run dev`, this file doesn't exist — the app
      falls back to import.meta.env.VITE_API_URL or localhost.
    -->
    <script src="/config.js" onerror="console.warn('config.js not found — using fallback API URL')"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
