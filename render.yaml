services:
  # ── 1. ML Service (FastAPI / Python) ─────────────────────────────────────
  - type: web
    name: polaris-ml
    env: docker
    dockerfilePath: ./ml/Dockerfile       # path from repo root
    dockerContext: ./ml                   # build context = ml/ folder
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama3-70b-8192
    healthCheckPath: /ping

  # ── 2. Backend Service (Node / Express) ──────────────────────────────────
  - type: web
    name: polaris-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PORT
        value: 5001
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: polaris-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: polaris-ml
          envVarKey: RENDER_EXTERNAL_URL
    healthCheckPath: /api/ping

  # ── 3. Frontend Service (Vite → nginx) ────────────────────────────────────
  - type: web
    name: polaris-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    dockerBuildArgs:
      - key: VITE_API_URL
        fromService:
          type: web
          name: polaris-backend
          envVarKey: RENDER_EXTERNAL_URL
    healthCheckPath: /ping
