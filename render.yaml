services:
  - type: web
    name: polaris-ml
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile.ml
    healthCheckPath: /ping
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama3-70b-8192

  - type: web
    name: polaris-backend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile.backend
    healthCheckPath: /api/ping
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: polaris-ml
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        fromService:
          type: web
          name: polaris-frontend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: polaris-frontend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile.frontend
    healthCheckPath: /ping
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: polaris-backend
          envVarKey: RENDER_EXTERNAL_URL
