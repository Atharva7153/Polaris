services:
  # ── 1. ML Service (FastAPI / Python) ─────────────────────────────────────
  - type: web
    name: polaris-ml
    env: docker                        # use Dockerfile instead of buildpacks
    rootDir: ml
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: GROQ_API_KEY
        sync: false                    # Set this manually in the Render dashboard
      - key: GROQ_MODEL
        value: llama3-70b-8192
    # Render native health-check (also used by UptimeRobot — see below)
    healthCheckPath: /ping

  # ── 2. Backend Service (Node / Express) ──────────────────────────────────
  - type: web
    name: polaris-backend
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 5001
      - key: MONGO_URI
        sync: false                    # Paste your MongoDB Atlas URI here
      - key: JWT_SECRET
        generateValue: true            # Render auto-generates a secure random value
      - key: FRONTEND_URL
        fromService:
          type: web
          name: polaris-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: polaris-ml
          envVarKey: RENDER_EXTERNAL_URL
    healthCheckPath: /api/ping

  # ── 3. Frontend Service (Vite → nginx static) ────────────────────────────
  - type: web
    name: polaris-frontend
    env: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
    # VITE_API_URL is a build-arg baked into the JS bundle at build time.
    # Render passes build args via the `dockerContext` + `dockerBuildArgs` block.
    dockerBuildArgs:
      - key: VITE_API_URL
        fromService:
          type: web
          name: polaris-backend
          envVarKey: RENDER_EXTERNAL_URL
    healthCheckPath: /ping
    # SPA routing is handled by nginx inside the container — no `routes` block needed.
