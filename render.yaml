services:
  # 1. ML Service (FastAPI)
  - type: web
    name: polaris-ml
    env: python
    rootDir: ml
    buildCommand: "pip install -r requirements.txt && python scripts/train_models.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: GROQ_API_KEY
        sync: false # Requires user to input this in the Render dashboard

  # 2. Backend Service (Node.js)
  - type: web
    name: polaris-backend
    env: node
    rootDir: backend
    buildCommand: "npm install"
    startCommand: "npm start"
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: polaris-ml
          envVarKey: RENDER_EXTERNAL_URL
      - key: MONGO_URI
        sync: false # User needs to provide their own MongoDB Atlas URI
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: polaris-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # 3. Frontend Service (Vite Static Site)
  - type: web
    name: polaris-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: VITE_API_URL
        fromService:
          type: web
          name: polaris-backend
          envVarKey: RENDER_EXTERNAL_URL
    # Ensure client-side routing works (Vite/React Router)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
